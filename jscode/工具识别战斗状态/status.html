<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        :root {
            --genshin-gold: #ece5d8;
            --genshin-active: #ffc107;
            --genshin-text: #3b4354;
            --genshin-bg: rgba(236, 229, 216, 0.9);
            /* 略微提高不透明度，增强质感 */
        }

        body {
            margin: 0;
            padding: 0px;
            background: transparent;
            font-family: 'Noto Sans SC', sans-serif;
            user-select: none;
            overflow: hidden;
        }

        /* 主容器：改为 2x2 网格 */
        .genshin-hud {
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 8px;
            padding: 12px;
            background: var(--genshin-bg);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            /* 减弱了圆角，不再是胶囊状 */
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            width: fit-content;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 140px;
            padding: 8px 12px;
            border-radius: 6px;
            /* 减弱圆角 */
            transition: all 0.2s ease;
            position: relative;
            border: 1px solid transparent;
        }

        /* 快捷键提示 */
        .status-key {
            background: #3b4354;
            color: #ece5d8;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 3px;
            margin-right: 10px;
            font-weight: 700;
            box-shadow: 0 1.5px 0 #1a1f29;
            flex-shrink: 0;
        }

        .status-label {
            font-size: 13px;
            color: var(--genshin-text);
            font-weight: 500;
            margin-right: auto;
        }

        /* 菱形指示灯 */
        .diamond-indicator {
            width: 9px;
            height: 9px;
            background: #bdc3c7;
            transform: rotate(45deg);
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            flex-shrink: 0;
            margin-left: 10px;
        }

        /* 激活状态 */
        .is-active {
            background: rgba(255, 255, 255, 0.5);
        }

        .is-active .diamond-indicator {
            background: #ffc107;
            box-shadow: 0 0 6px #ffc107;
            border-color: #d4a017;
        }

        .is-active .status-label {
            color: #000;
            font-weight: 700;
        }

        /* 关闭状态 */
        .is-off {
            opacity: 0.5;
        }

        /* 触发状态（单次战斗） */
        .is-trigger {
            background: #3b4354;
            border-color: #4b5563;
        }

        .is-trigger .status-label {
            color: #ece5d8;
        }

        .is-trigger .diamond-indicator {
            background: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: rotate(45deg) scale(1);
                opacity: 1;
            }

            50% {
                transform: rotate(45deg) scale(1.25);
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>

    <div class="genshin-hud" id="statusBar">
        <!-- 默认展示状态 -->
        <div class="status-item is-active">
            <span class="status-key">F6</span>
            <span class="status-label">战斗检测</span>
            <div class="diamond-indicator"></div>
        </div>

        <div class="status-item is-active">
            <span class="status-key">F7</span>
            <span class="status-label">自动拾取</span>
            <div class="diamond-indicator"></div>
        </div>

        <div class="status-item is-off">
            <span class="status-key">F8</span>
            <span class="status-label">剧情跳过</span>
            <div class="diamond-indicator"></div>
        </div>

        <div class="status-item is-trigger">
            <span class="status-key">F9</span>
            <span class="status-label">单次战斗</span>
            <div class="diamond-indicator"></div>
        </div>
    </div>

    <script>
        /**
         * 状态更新逻辑
         * @param {Object} states - 包含状态布尔值的对象
         */
        function updateStatus(states) {
            const statusBar = document.getElementById('statusBar');
            if (!statusBar) return;

            const config = [
                { key: 'F6', label: '战斗检测', val: states.battleDetection },
                { key: 'F7', label: '自动拾取', val: states.autoPick },
                { key: 'F8', label: '剧情跳过', val: states.autoSkip },
                { key: 'F9', label: '单次战斗', val: states.singleBattle, special: true }
            ];

            const html = config.map(item => {
                let statusClass = item.val ? 'is-active' : 'is-off';
                if (item.special) {
                    statusClass = item.val ? 'is-trigger' : 'is-off';
                }

                return `
                    <div class="status-item ${statusClass}">
                        <div class="flex items-center">
                            <span class="status-key">${item.key}</span>
                            <span class="status-label">${item.label}</span>
                        </div>
                        <div class="diamond-indicator"></div>
                    </div>
                `;
            }).join('');

            statusBar.innerHTML = html;
        }

        // 测试接口：可以直接在控制台调用 window.updateStatus({...})
        // window.updateStatus({
        //     battleDetection: true,
        //     autoPick: true,
        //     autoSkip: false,
        //     singleBattle: false
        // });
    </script>
</body>

</html>
