<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Radar</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: transparent;
            /* 完全透明背景 */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        #container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            gap: 15px;
            background-color: transparent;
            /* 容器也透明 */
            padding: 5px;
        }

        #radarCtx {
            width: 300px;
            /* 固定宽度 */
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 左侧无背景，仅包含雷达 */
        }

        canvas {
            border: 2px solid #333;
            border-radius: 50%;
            /* 圆形 */
            background-color: rgba(255, 255, 255, 0.1);
            /* 稍微一点点底色让圆圈可见 */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        #infoCtx {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        #logs {
            flex: 2;
            border: 2px solid #333;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.95);
            /* 右上白色背景 */
            color: #333;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .log-item {
            margin-bottom: 4px;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }

        .log-time {
            color: #888;
            font-size: 0.8em;
            margin-right: 5px;
        }

        #status {
            flex: 1;
            border: 2px solid #333;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.95);
            /* 右下白色背景 */
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="radarCtx">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
        </div>
        <div id="infoCtx">
            <div id="logs">
                <div style="text-align: center; color: #888; padding-top: 20px;">之前状态日志</div>
            </div>
            <div id="status">当前状态</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const logsContainer = document.getElementById('logs');
        const statusDiv = document.getElementById('status');

        const CENTER_X = canvas.width / 2;
        const CENTER_Y = canvas.height / 2;
        const SCALE = 2.0; // 缩放比例

        function updateDisplay(data) {
            // 1. 更新当前状态
            if (data.currentState) {
                statusDiv.innerText = data.currentState;
            }

            // 2. 更新日志
            if (data.logs && data.logs.length > 0) {
                logsContainer.innerHTML = '';
                [...data.logs].reverse().forEach(logMsg => {
                    const div = document.createElement('div');
                    div.className = 'log-item';

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'log-time';
                    const now = new Date();
                    timeSpan.innerText = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

                    const msgSpan = document.createElement('span');
                    msgSpan.innerText = logMsg;

                    div.appendChild(timeSpan);
                    div.appendChild(msgSpan);
                    logsContainer.appendChild(div);
                });
            }

            // 3. 绘制雷达
            drawRadar(data.currentPos, data.pathHistory);
        }

        function drawRadar(currentPos, historyPoints) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制十字准星背景 (可选)
            // ctx.beginPath();
            // ctx.moveTo(0, CENTER_Y); ctx.lineTo(canvas.width, CENTER_Y);
            // ctx.moveTo(CENTER_X, 0); ctx.lineTo(CENTER_X, canvas.height);
            // ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            // ctx.stroke();

            // 绘制中心点 (当前位置)
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4d4f'; // 红色中心点
            ctx.fill();

            if (!currentPos || !historyPoints || historyPoints.length === 0) return;

            // 绘制路径线
            ctx.beginPath();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;

            let firstPoint = true;

            for (let i = 0; i < historyPoints.length; i++) {
                const pt = historyPoints[i];
                const relX = (pt.x - currentPos.x) * SCALE;
                const relY = -(pt.y - currentPos.y) * SCALE; // Y轴反转

                const canvasX = CENTER_X + relX;
                const canvasY = CENTER_Y + relY;

                if (firstPoint) {
                    ctx.moveTo(canvasX, canvasY);
                    firstPoint = false;
                } else {
                    ctx.lineTo(canvasX, canvasY);
                }
            }
            ctx.stroke();
        }
    </script>
</body>

</html>
