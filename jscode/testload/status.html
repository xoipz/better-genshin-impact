<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        :root {
            --genshin-gold: #ece5d8;
            --genshin-active: #ffc107;
            --genshin-text: #3b4354;
            --genshin-bg: rgba(236, 229, 216, 0.95);
            --genshin-dark: #3b4354;
        }

        /* 铺满全屏，无边距 */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            /* 悬浮窗通常背景透明 */
            font-family: 'Noto Sans SC', sans-serif;
            user-select: none;
            color: var(--genshin-text);
        }

        /* 主容器响应式布局 */
        .hud-container {
            display: grid;
            /* 使用 fr 单位实现比例缩放，minmax 确保不至于挤压变形 */
            grid-template-columns: minmax(200px, 1fr) minmax(180px, 0.8fr) minmax(250px, 1.5fr);
            gap: 15px;
            background: var(--genshin-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);

            /* 关键：铺满父级容器 */
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 防止溢出 */
        }

        /* 圆圈尺寸固定或随容器微调 */
        .circle-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .circle-status {
            aspect-ratio: 1 / 1;
            width: 85%;
            /* 随左侧宽度缩放 */
            max-width: 220px;
            border-radius: 50%;
            border: 3px solid var(--genshin-dark);
            position: relative;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(200, 200, 200, 0.1) 100%);
        }

        .recording-pulse {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff4d4d;
            border-radius: 50%;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }

            50% {
                transform: translateX(-50%) scale(1.5);
                opacity: 0.5;
            }

            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        /* 列表区域自适应高度 */
        .step-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            margin-top: 5px;
        }

        .key-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .key-item.active {
            border-left: 4px solid var(--genshin-active);
            background: white;
        }

        .key-cap {
            background: var(--genshin-dark);
            color: var(--genshin-gold);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 8px;
        }

        .step-item {
            font-size: 12px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
        }

        #taskNameInput {
            background: transparent;
            border: none;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.2);
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        #taskNameInput:focus {
            border-bottom-color: var(--genshin-active);
        }

        .diamond {
            width: 7px;
            height: 7px;
            background: #bdc3c7;
            transform: rotate(45deg);
        }

        .diamond.active {
            background: var(--genshin-active);
            box-shadow: 0 0 5px var(--genshin-active);
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="hud-container">

        <!-- 左侧：图形与坐标 -->
        <div class="flex flex-col h-full">
            <div class="circle-container">
                <div class="circle-status" id="canvasArea">
                    <div id="recordDot" class="recording-pulse hidden"></div>
                </div>
            </div>

            <div class="text-center mt-2 pb-2">
                <div class="text-[10px] text-gray-400 uppercase tracking-widest">Coordinates</div>
                <div id="currentCoords" class="text-lg font-bold">124.5, -67.2</div>
                <div id="recordStatus"
                    class="inline-block text-[9px] font-bold px-2 py-0.5 bg-gray-200 rounded-full mt-1">IDLE</div>

                <div class="border-t border-gray-200 pt-3 mt-3">
                    <div class="text-[9px] text-gray-400 uppercase mb-1">Task Name</div>
                    <input type="text" id="taskNameInput" value="世界任务：影向祓行_R1">
                </div>
            </div>
        </div>

        <!-- 中间：按键控制 -->
        <div class="hud-card">
            <div class="text-[11px] font-bold mb-3 border-b pb-1 border-gray-300">功能控制 [KEYS]</div>
            <div id="keyBindings" class="flex-1 overflow-y-auto">
                <!-- 由 JS 渲染 -->
            </div>
        </div>

        <!-- 右侧：日志与 OCR -->
        <div class="flex flex-col gap-3 h-full overflow-hidden">
            <!-- 步骤日志 - flex-1 占据剩余空间 -->
            <div class="hud-card flex-1">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[11px] font-bold">日志 (Log)</span>
                    <button onclick="undo()"
                        class="text-[9px] bg-gray-200 px-1.5 py-0.5 rounded hover:bg-gray-300">撤销</button>
                </div>
                <div id="stepList" class="step-list">
                    <!-- 步骤项 -->
                </div>
            </div>

            <!-- OCR 内容 - 固定较小高度 -->
            <div class="hud-card h-[85px] shrink-0">
                <div class="text-[9px] font-bold text-gray-500 mb-1">OCR CONTENT</div>
                <div id="ocrContent" class="text-xs bg-white/40 p-1.5 rounded italic text-gray-600 overflow-y-auto">
                    等待识别...
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            isRecording: false,
            taskName: "世界任务：影向祓行_R1",
            currentCoords: { x: 124.5, y: -67.2 },
            keys: [
                { key: 'F6', label: '录制/暂停', active: false },
                { key: 'F7', label: '路径分段', active: false },
                { key: 'F8', label: 'OCR锚点', active: false },
                { key: 'F9', label: '战斗标记', active: false }
            ],
            steps: [
                { id: 1, name: "移动到传送点", start: [100, 20], end: [120, 30], type: 'move' },
                { id: 2, name: "对话NPC", start: [120, 30], end: [120, 30], type: 'ocr' }
            ],
            history: []
        };

        function render() {
            document.getElementById('currentCoords').innerText = `${state.currentCoords.x.toFixed(1)}, ${state.currentCoords.y.toFixed(1)}`;

            const taskInput = document.getElementById('taskNameInput');
            if (document.activeElement !== taskInput) taskInput.value = state.taskName;

            const statusEl = document.getElementById('recordStatus');
            const dotEl = document.getElementById('recordDot');
            if (state.isRecording) {
                statusEl.innerText = "RECORDING";
                statusEl.className = "inline-block text-[9px] font-bold px-2 py-0.5 bg-red-500 text-white rounded-full mt-1";
                dotEl.classList.remove('hidden');
            } else {
                statusEl.innerText = "PAUSED";
                statusEl.className = "inline-block text-[9px] font-bold px-2 py-0.5 bg-gray-500 text-white rounded-full mt-1";
                dotEl.classList.add('hidden');
            }

            document.getElementById('keyBindings').innerHTML = state.keys.map(k => `
            <div class="key-item ${k.active ? 'active' : ''}">
                <div class="flex items-center">
                    <span class="key-cap">${k.key}</span>
                    <span class="text-[11px] font-medium">${k.label}</span>
                </div>
                <div class="diamond ${k.active ? 'active' : ''}"></div>
            </div>
        `).join('');

            document.getElementById('stepList').innerHTML = state.steps.slice().reverse().map(s => `
            <div class="step-item">
                <div class="flex-1 min-w-0 pr-2">
                    <div class="font-bold text-gray-800 truncate cursor-pointer hover:text-blue-500" onclick="renameStep(${s.id})">
                        ${s.type === 'move' ? '🏃' : '🎯'} ${s.name}
                    </div>
                    <div class="text-[8px] text-gray-500">
                        ${s.start.join(',')} ➔ ${s.end.join(',')}
                    </div>
                </div>
                <div class="flex shrink-0 gap-1">
                    <div class="cursor-pointer text-[14px] leading-none" onclick="deleteStep(${s.id})">×</div>
                </div>
            </div>
        `).join('');
        }

        document.getElementById('taskNameInput').addEventListener('input', (e) => state.taskName = e.target.value);

        function toggleRecord() {
            saveHistory();
            state.isRecording = !state.isRecording;
            state.keys[0].active = state.isRecording;
            render();
        }

        function addStep(name, type = 'move') {
            saveHistory();
            state.steps.push({
                id: Date.now(),
                name,
                start: [state.currentCoords.x.toFixed(0), state.currentCoords.y.toFixed(0)],
                end: [(state.currentCoords.x + 2).toFixed(0), (state.currentCoords.y + 2).toFixed(0)],
                type
            });
            render();
        }

        function deleteStep(id) {
            saveHistory();
            state.steps = state.steps.filter(s => s.id !== id);
            render();
        }

        function renameStep(id) {
            const step = state.steps.find(s => s.id === id);
            const name = prompt("修改步骤名:", step.name);
            if (name) { saveHistory(); step.name = name; render(); }
        }

        function saveHistory() {
            state.history.push(JSON.stringify(state.steps));
            if (state.history.length > 20) state.history.shift();
        }

        function undo() {
            if (state.history.length > 0) {
                state.steps = JSON.parse(state.history.pop());
                render();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key.toLowerCase() === 'f6') toggleRecord();
            if (e.key.toLowerCase() === 'f8') addStep("OCR 锚点", "ocr");
            if (e.ctrlKey && e.key === 'z') undo();
        });

        render();
        setInterval(() => {
            if (state.isRecording) {
                state.currentCoords.x += (Math.random() - 0.5);
                state.currentCoords.y += (Math.random() - 0.5);
                render();
            }
        }, 1000);
    </script>
</body>

</html>
