<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --genshin-gold: #ece5d8;
            --genshin-active: #ffc107;
            --genshin-text: #3b4354;
            --genshin-bg: rgba(236, 229, 216, 0.95);
            --genshin-dark: #3b4354;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            user-select: none;
            color: var(--genshin-text);
        }

        .hidden { display: none; }

        /* ===== Full Mode (default) ===== */
        .hud-container {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) minmax(180px, 0.8fr) minmax(250px, 1.5fr);
            gap: 15px;
            background: var(--genshin-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            width: 100%; height: 100%;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .circle-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .circle-status {
            aspect-ratio: 1 / 1;
            width: 85%;
            max-width: 220px;
            border-radius: 50%;
            border: 3px solid var(--genshin-dark);
            position: relative;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(200,200,200,0.1) 100%);
            overflow: hidden;
        }

        #pathCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
        }

        .recording-dot {
            width: 8px; height: 8px;
            background: #ff4d4d;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%   { transform: scale(1);   opacity: 1; }
            50%  { transform: scale(1.3); opacity: 0.6; }
            100% { transform: scale(1);   opacity: 1; }
        }

        .key-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.6);
            margin-bottom: 6px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .key-item.active {
            border-left: 4px solid var(--genshin-active);
            background: white;
        }

        .key-cap {
            background: var(--genshin-dark);
            color: var(--genshin-gold);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 8px;
        }

        .diamond {
            width: 7px; height: 7px;
            background: #bdc3c7;
            transform: rotate(45deg);
        }
        .diamond.active {
            background: var(--genshin-active);
            box-shadow: 0 0 5px var(--genshin-active);
        }

        .step-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            margin-top: 5px;
        }

        .step-item {
            font-size: 12px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
        }

        #taskNameInput {
            background: transparent;
            border: none;
            border-bottom: 1px dashed rgba(0,0,0,0.2);
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            outline: none;
            color: var(--genshin-text);
        }

        #taskNameInput:focus { border-bottom-color: var(--genshin-active); }

        .icon-btn {
            background: #e5e7eb;
            border: none;
            border-radius: 4px;
            padding: 3px 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: #d1d5db; }
        .icon-btn svg { width: 14px; height: 14px; fill: var(--genshin-text); }

        .hotkey-hint {
            font-size: 8px;
            margin-left: 2px;
            opacity: 0.6;
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

        .recording-dot.inactive {
            background: #9ca3af;
            animation: none;
        }
        .status-pill { display: none; }

        /* Minimized action buttons: hidden in full mode */
        .minimized-actions { display: none; }

        /* Init overlay */
        #initOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--genshin-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }
        #initOverlay.hidden { display: none; }
        .init-spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(59,67,84,0.2);
            border-top-color: var(--genshin-dark);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Minimized Mode ===== */
        .hud-container.minimized {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            padding: 8px;
            border-radius: 0;
        }

        .hud-container.minimized .section-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .hud-container.minimized .circle-container { flex: none; }

        .hud-container.minimized .circle-status {
            width: 110px;
            max-width: 110px;
        }

        .hud-container.minimized .section-info { display: none; }

        .hud-container.minimized .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(236, 229, 216, 0.6);
            border-radius: 16px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .hud-container.minimized .section-keys {
            background: transparent;
            border: none;
            padding: 0;
        }

        .hud-container.minimized .card-header { display: none; }

        .hud-container.minimized .key-item {
            background: rgba(236, 229, 216, 0.6);
            border-radius: 16px;
            padding: 4px 10px;
            margin-bottom: 4px;
            border-left: none;
        }

        .hud-container.minimized .key-item.active {
            border-left: none;
            background: rgba(255, 193, 7, 0.6);
        }

        .hud-container.minimized .diamond { display: none; }

        .hud-container.minimized .minimized-actions { display: block; }
        .hud-container.minimized .minimized-actions .key-item { cursor: pointer; }

        .hud-container.minimized .section-log { display: none !important; }
    </style>
</head>

<body>
    <!-- Init overlay -->
    <div id="initOverlay">
        <div class="init-spinner"></div>
        <div style="font-size:12px;margin-top:12px;color:#4b5563;">正在初始化...</div>
    </div>

    <div class="hud-container" id="hudContainer">
        <!-- Column 1: Map + Status -->
        <div class="section-left" style="display:flex;flex-direction:column;height:100%;">
            <div class="circle-container">
                <div class="circle-status" id="canvasArea">
                    <canvas id="pathCanvas"></canvas>
                </div>
            </div>

            <!-- Minimized mode: compact status pill -->
            <div class="status-pill">
                <div id="recordDotMini" class="recording-dot inactive"></div>
                <span id="coordsMini" style="white-space:nowrap;">---, ---</span>
            </div>

            <!-- Full mode: info section -->
            <div class="section-info" style="text-align:center;margin-top:8px;padding-bottom:8px;">
                <div style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.1em;">Coordinates</div>
                <div id="currentCoords" style="font-size:1.125rem;font-weight:700;">---, ---</div>
                <div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px;">
                    <div id="recordDot" class="recording-dot hidden"></div>
                    <span id="recordStatus" style="display:inline-block;font-size:9px;font-weight:700;padding:1px 8px;background:#e5e7eb;border-radius:9999px;">IDLE</span>
                </div>
                <div style="border-top:1px solid #e5e7eb;padding-top:12px;margin-top:12px;">
                    <div style="font-size:9px;color:#9ca3af;margin-bottom:4px;">任务名</div>
                    <input type="text" id="taskNameInput" value="" placeholder="等待初始化...">
                </div>
            </div>
        </div>

        <!-- Column 2: Key Bindings -->
        <div class="hud-card section-keys">
            <div class="card-header" style="font-size:11px;font-weight:700;margin-bottom:12px;border-bottom:1px solid #d1d5db;padding-bottom:4px;display:flex;justify-content:space-between;align-items:center;">
                <span>功能控制 [KEYS]</span>
                <button class="icon-btn" onclick="exportData()" title="导出">
                    <svg viewBox="0 0 24 24"><path d="M5 4v2h14V4H5zm0 10h4v6h6v-6h4l-7-7-7 7z"/></svg>
                </button>
            </div>
            <div id="keyBindings" style="flex:1;overflow-y:auto;"></div>

            <!-- Minimized mode: restore button -->
            <div class="minimized-actions">
                <div class="key-item" onclick="toggleMinimize()">
                    <div style="display:flex;align-items:center;">
                        <span class="key-cap">0</span>
                        <span style="font-size:11px;font-weight:500;">恢复窗口</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column 3: Log -->
        <div class="section-log" style="display:flex;flex-direction:column;gap:12px;height:100%;overflow:hidden;">
            <div class="hud-card" style="flex:1;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <span style="font-size:11px;font-weight:700;">日志 (Log)</span>
                    <button class="icon-btn" onclick="undo()" title="撤销">
                        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.98-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                    </button>
                </div>
                <div id="stepList" class="step-list"></div>
            </div>
        </div>
    </div>

    <script>
        const MAP_UNIT = 40;

        let isInitialized = false;
        let isMinimized = false;

        let state = {
            isRecording: false,
            taskName: "",
            currentCoords: { x: 0, y: 0 },
            keys: [],
            steps: [],
            pathPoints: [],
            isMinimized: false
        };

        window.clientAction = null;
        let lastPathPointsCount = 0;

        // Path drawing - current position at center, fixed scale
        function drawPath() {
            const canvas = document.getElementById('pathCanvas');
            const container = document.getElementById('canvasArea');
            if (!canvas || !container) return;

            const rect = container.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            if (size <= 0) return;
            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, size, size);

            const cx = size / 2;
            const cy = size / 2;
            const points = state.pathPoints || [];

            // Current position indicator at center
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (points.length < 1) return;

            const current = points[points.length - 1];
            const scale = (size * 0.4) / MAP_UNIT;

            // Coordinate mapping: negate (trail shows opposite of movement direction)
            const toCanvas = (p) => ({
                x: cx - (p.x - current.x) * scale,
                y: cy - (p.y - current.y) * scale
            });

            // Path lines
            if (points.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(59, 67, 84, 0.5)';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const first = toCanvas(points[0]);
                ctx.moveTo(first.x, first.y);
                for (let i = 1; i < points.length; i++) {
                    const p = toCanvas(points[i]);
                    ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            // Draw points with gradient colors
            for (let i = 0; i < points.length - 1; i++) {
                const p = points[i];
                const cp = toCanvas(p);
                const progress = i / Math.max(1, points.length - 1);

                if (p.type === 'teleport') {
                    ctx.save();
                    ctx.translate(cp.x, cp.y);
                    ctx.rotate(Math.PI / 4);
                    ctx.fillStyle = '#ffc107';
                    ctx.fillRect(-4, -4, 8, 8);
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-4, -4, 8, 8);
                    ctx.restore();
                } else if (i === 0) {
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#22c55e';
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else {
                    const gray = Math.floor(180 - progress * 100);
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
                    ctx.fill();
                }
            }

            // Redraw center on top
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // External update entry
        function updateState(newState) {
            if (!isInitialized && newState.keys && newState.keys.length > 0) {
                isInitialized = true;
                document.getElementById('initOverlay').classList.add('hidden');
            }

            const pathChanged = newState.pathPoints &&
                               newState.pathPoints.length !== lastPathPointsCount;

            // Handle minimize state change
            if (newState.isMinimized !== undefined && newState.isMinimized !== isMinimized) {
                isMinimized = newState.isMinimized;
                document.getElementById('hudContainer').classList.toggle('minimized', isMinimized);
                setTimeout(() => drawPath(), 50);
            }

            state = { ...state, ...newState };
            if (pathChanged) lastPathPointsCount = state.pathPoints.length;
            render(pathChanged);
        }

        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function render(forceDrawPath = false) {
            if (!isInitialized) return;

            const coordsText = `${state.currentCoords.x.toFixed(1)}, ${state.currentCoords.y.toFixed(1)}`;
            document.getElementById('currentCoords').innerText = coordsText;
            document.getElementById('coordsMini').innerText = coordsText;

            const taskInput = document.getElementById('taskNameInput');
            if (document.activeElement !== taskInput) taskInput.value = state.taskName;

            // Recording status
            const statusEl = document.getElementById('recordStatus');
            const dotEl = document.getElementById('recordDot');
            const dotMiniEl = document.getElementById('recordDotMini');

            if (state.isRecording) {
                statusEl.innerText = 'REC';
                statusEl.style.backgroundColor = '#ef4444';
                statusEl.style.color = 'white';
                dotEl.classList.remove('hidden');
                dotMiniEl.classList.remove('inactive');
            } else {
                statusEl.innerText = 'STOP';
                statusEl.style.backgroundColor = '#6b7280';
                statusEl.style.color = 'white';
                dotEl.classList.add('hidden');
                dotMiniEl.classList.add('inactive');
            }

            // Key bindings
            document.getElementById('keyBindings').innerHTML = state.keys.map(k => `
                <div class="key-item ${k.active ? 'active' : ''}">
                    <div style="display:flex;align-items:center;">
                        <span class="key-cap">${k.key}</span>
                        <span style="font-size:11px;font-weight:500;">${k.label}</span>
                    </div>
                    <div class="diamond ${k.active ? 'active' : ''}"></div>
                </div>
            `).join('');

            // Step list
            if (state.steps !== render.lastStepsRef) {
                render.lastStepsRef = state.steps;
                document.getElementById('stepList').innerHTML = state.steps.map(s => `
                    <div class="step-item">
                        <div style="flex:1;min-width:0;padding-right:8px;">
                            <div style="font-weight:700;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;"
                                 data-id="${s.id}" data-name="${escapeAttr(s.name)}" onclick="renameStepEl(this)">
                                ${getIcon(s.type)} ${escapeAttr(s.name)}
                            </div>
                            <div style="font-size:8px;color:#6b7280;">
                                ${formatCoords(s.start)} -> ${formatCoords(s.end)}
                            </div>
                        </div>
                        <div style="flex-shrink:0;cursor:pointer;font-size:14px;line-height:1;" onclick="deleteStep(${s.id})">x</div>
                    </div>
                `).join('');
            }

            if (forceDrawPath || state.pathPoints.length !== render.lastPathCount) {
                render.lastPathCount = state.pathPoints.length;
                drawPath();
            }
        }
        render.lastStepsRef = null;
        render.lastPathCount = 0;

        function getIcon(type) {
            if (type === 'move' || type === 'path') return '🏃';
            if (type === 'fight') return '⚔️';
            if (type === 'ocr' || type === 'dialogue') return '💬';
            return '📄';
        }

        function formatCoords(c) {
            if (!c) return '0,0';
            if (Array.isArray(c)) return `${c[0]},${c[1]}`;
            return `${c.x},${c.y}`;
        }

        document.getElementById('taskNameInput').addEventListener('change', e => {
            window.clientAction = { type: 'update_task_name', name: e.target.value };
        });

        function deleteStep(id) {
            window.clientAction = { type: 'delete_step', id: id };
        }

        function renameStepEl(el) {
            const id = Number(el.dataset.id);
            const oldName = el.dataset.name;
            const name = prompt('修改步骤名称:', oldName);
            if (name && name !== oldName) {
                window.clientAction = { type: 'rename_step', id: id, newName: name };
            }
        }

        function undo() {
            window.clientAction = { type: 'undo' };
        }

        function toggleMinimize() {
            window.clientAction = { type: 'toggle_minimize' };
        }

        function exportData() {
            window.clientAction = { type: 'export' };
        }

        window.addEventListener('resize', () => drawPath());
    </script>
</body>

</html>
